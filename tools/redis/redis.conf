# Redis 配置文件
# 适用于 Windows 环境（Git Bash / WSL）

# 网络配置
bind 127.0.0.1
port 6379
protected-mode yes

# 密码配置
requirepass 123456

# 数据持久化配置
# RDB 持久化
save 900 1
save 300 10
save 60 10000

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 日志配置
loglevel notice
logfile ""

# 数据库数量
databases 16

# 客户端连接配置
timeout 0
tcp-keepalive 300
maxclients 10000

# 内存配置
maxmemory-policy noeviction

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 其他配置
daemonize no
pidfile ""

